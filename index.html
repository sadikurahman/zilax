<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zilax - Shop • Rent • Live Better</title>

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        }

        body {
            background: #f6f9fc;
            color: #333;
            padding-bottom: 85px;
        }

        /* Main Mobile App */
        .phone-container {
            width: 100%;
            max-width: 415px;
            min-height: 100vh;
            margin: auto;
            background: #fff;
            position: relative;
            overflow-x: hidden;
            box-shadow: 0 0 30px rgba(0,0,0,0.06);
        }

        /* ================= HEADER ================= */

        header {
            background: linear-gradient(180deg, #005a36, #013f26);
            padding: 22px 16px 25px;
            color: white;
            border-bottom-left-radius: 28px;
            border-bottom-right-radius: 28px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon-box {
            width: 34px;
            height: 34px;
            background: #00cc66;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(-7deg);
            box-shadow: 0 4px 10px rgba(0,204,102,.3);
        }

        .logo-icon-box i {
            color: white;
            font-size: 17px;
            transform: rotate(7deg);
        }

        .brand-name {
            font-size: 25px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: .5px;
        }

        .brand-sub {
            font-size: 9.5px;
            color: #9ab8af;
            margin-top: 4px;
        }

        .right-actions {
            display: flex;
            gap: 18px;
            font-size: 21px;
            align-items: center;
        }

        .icon-btn-wrapper {
            position: relative;
            cursor: pointer;
        }

        .noti-badge {
            position: absolute;
            top: -7px;
            right: -7px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #eb4d4b;
            color: white;
            font-size: 9px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid #013f26;
        }

        /* Search */

        .search-wrapper {
            position: relative;
            width: 100%;
        }

        .search-wrapper input {
            width: 100%;
            border: none;
            outline: none;
            padding: 13px 45px 13px 44px;
            border-radius: 14px;
            background: white;
            font-size: 14px;
            color: #333;
            box-shadow: 0 4px 12px rgba(0,0,0,.06);
        }

        .search-left-icon {
            position: absolute;
            left: 16px;
            top: 15px;
            color: #7f8c8d;
            font-size: 15px;
            z-index: 2;
        }

        .qr-right-icon {
            position: absolute;
            right: 16px;
            top: 14px;
            color: #333;
            font-size: 18px;
            cursor: pointer;
        }

        /* ================= MAIN ================= */

        .main-layout {
            padding: 16px;
        }

        /* Hero */

        .hero-slider {
            min-height: 145px;
            background: linear-gradient(135deg, #091a14, #12281e);
            color: white;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            margin-bottom: 11px;
            box-shadow: 0 8px 24px rgba(0,0,0,.12);
        }

        .slider-details {
            width: 58%;
        }

        .slider-details h2 {
            font-size: 22px;
            margin-bottom: 6px;
        }

        .slider-details p {
            color: #a8b8b1;
            font-size: 11.5px;
            margin-bottom: 14px;
        }

        .order-action-btn {
            border: none;
            background: #00cc66;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .order-action-btn i {
            margin-left: 4px;
        }

        .food-graphic {
            width: 120px;
            height: 100px;
            border-radius: 16px;
            background:
                linear-gradient(rgba(0,0,0,.08),rgba(0,0,0,.08)),
                url("https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=500&q=80")
                center/cover;
            flex-shrink: 0;
        }

        /* Slider dots */

        .carousel-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin: 2px 0 24px;
        }

        .indicator-dot {
            width: 6px;
            height: 6px;
            background: #dfe6e9;
            border-radius: 10px;
        }

        .indicator-dot.active {
            width: 16px;
            background: #005a36;
        }

        /* ================= CATEGORY ================= */

        .grid-categories-box {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 8px;
            margin-bottom: 26px;
        }

        .grid-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            text-decoration: none;
        }

        .round-avatar {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 23px;
            margin-bottom: 8px;
            transition: .2s;
        }

        .grid-node:active .round-avatar {
            transform: scale(.92);
        }

        .node-label {
            font-size: 11.5px;
            font-weight: 600;
            color: #2d3436;
        }

        .col-food {
            background: #fff2e6;
            color: #ff6600;
        }

        .col-cloth {
            background: #e6f2ff;
            color: #0066ff;
        }

        .col-shoe {
            background: #e6f7ff;
            color: #0099ff;
        }

        .col-car {
            background: #e6ffe6;
            color: #00aa55;
        }

        .col-decor {
            background: #ffe6eb;
            color: #ff3366;
        }

        .col-sound {
            background: #f3e8ff;
            color: #9333ea;
        }

        .col-elec {
            background: #e0f2fe;
            color: #0369a1;
        }

        .col-more {
            background: #edf2f7;
            color: #4a5568;
        }

        /* ================= PROMO ================= */

        .promo-marketing-card {
            background: linear-gradient(135deg, #0a5c36, #0e7545);
            color: white;
            padding: 16px 18px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 27px;
            box-shadow: 0 6px 18px rgba(10,92,54,.15);
        }

        .promo-meta h4 {
            font-size: 15px;
            margin-bottom: 4px;
        }

        .promo-meta p {
            font-size: 11px;
            opacity: .9;
        }

        .action-sub-btn {
            border: none;
            background: #00cc66;
            color: white;
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ================= DEALS ================= */

        .deals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        .deals-header h3 {
            font-size: 17px;
            color: #2c3e50;
        }

        .deals-header a {
            text-decoration: none;
            color: #7f8c8d;
            font-size: 12px;
            font-weight: 600;
        }

        /* Product cards */

        .products {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            padding-bottom: 10px;
        }

        .product-card {
            background: #fff;
            border: 1px solid #f0f2f4;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 3px 12px rgba(0,0,0,.04);
        }

        .product-image {
            width: 100%;
            height: 125px;
            object-fit: cover;
            display: block;
        }

        .product-info {
            padding: 10px;
        }

        .product-name {
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .product-price {
            color: #008f4c;
            font-weight: 800;
            font-size: 14px;
        }

        .product-old-price {
            color: #999;
            text-decoration: line-through;
            font-size: 10px;
            margin-left: 4px;
        }

        .add-cart {
            width: 100%;
            border: none;
            background: #f0fff7;
            color: #008f4c;
            padding: 7px;
            margin-top: 8px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ================= BOTTOM NAV ================= */

        .fixed-footer-nav {
            position: fixed;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            width: 100%;
            max-width: 415px;
            background: white;
            display: flex;
            justify-content: space-between;
            padding: 9px 10px 11px;
            border-top: 1px solid #f1f2f6;
            z-index: 999;
            box-shadow: 0 -4px 15px rgba(0,0,0,.05);
        }

        .footer-action-node {
            width: 20%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #a4b0be;
            text-decoration: none;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .footer-action-node i {
            font-size: 20px;
        }

        .footer-action-node.active {
            color: #005a36;
        }

        .cart-wrapper-rel {
            position: relative;
        }

        .cart-badge {
            position: absolute;
            top: -7px;
            right: -9px;
            width: 16px;
            height: 16px;
            background: #eb4d4b;
            color: white;
            border-radius: 50%;
            font-size: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ================= RESPONSIVE ================= */

        @media (min-width: 600px) {
            body {
                padding-top: 20px;
            }

            .phone-container {
                border-radius: 25px;
                min-height: calc(100vh - 40px);
            }

            .fixed-footer-nav {
                bottom: 20px;
                border-radius: 0 0 20px 20px;
            }
        }
    </style>
</head>

<body>

<div class="phone-container">

    <!-- ================= HEADER ================= -->

    <header>

        <div class="top-bar">

            <div class="logo-section">

                <div class="logo-icon-box">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>

                <div>
                    <div class="brand-name">Zilax</div>
                    <div class="brand-sub">
                        Shop • Rent • Live Better
                    </div>
                </div>

            </div>

            <div class="right-actions">

                <div class="icon-btn-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>

                <div class="icon-btn-wrapper">
                    <i class="fa-regular fa-bell"></i>
                    <span class="noti-badge">2</span>
                </div>

            </div>

        </div>

        <!-- Search -->

        <div class="search-wrapper">

            <i class="fa-solid fa-magnifying-glass search-left-icon"></i>

            <input
                type="text"
                id="searchInput"
                placeholder="কী খুঁজছেন?"
            >

            <i
                class="fa-solid fa-qrcode qr-right-icon"
                onclick="openQR()"
            ></i>

        </div>

    </header>


    <!-- ================= MAIN ================= -->

    <main class="main-layout">

        <!-- Hero -->

        <div class="hero-slider">

            <div class="slider-details">

                <h2>মজাদার খাবার</h2>

                <p>
                    এখন আপনার হাতের নাগালে!
                </p>

                <button
                    class="order-action-btn"
                    onclick="showMessage('খাবারের পেজ শীঘ্রই আসছে!')"
                >
                    অর্ডার করুন
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </div>

            <div class="food-graphic"></div>

        </div>


        <!-- Dots -->

        <div class="carousel-dots">

            <div class="indicator-dot active"></div>
            <div class="indicator-dot"></div>
            <div class="indicator-dot"></div>
            <div class="indicator-dot"></div>
            <div class="indicator-dot"></div>

        </div>


        <!-- ================= CATEGORIES ================= -->

        <div class="grid-categories-box">

            <div
                class="grid-node"
                onclick="selectCategory('খাবার')"
            >
                <div class="round-avatar col-food">
                    <i class="fa-solid fa-burger"></i>
                </div>
                <div class="node-label">খাবার</div>
            </div>


            <div
                class="grid-node"
                onclick="selectCategory('কাপড়')"
            >
                <div class="round-avatar col-cloth">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <div class="node-label">কাপড়</div>
            </div>


            <div
                class="grid-node"
                onclick="selectCategory('জুতা')"
            >
                <div class="round-avatar col-shoe">
                    <i class="fa-solid fa-shoe-prints"></i>
                </div>
                <div class="node-label">জুতা</div>
            </div>


            <div
                class="grid-node"
                onclick="selectCategory('গাড়ি')"
            >
                <div class="round-avatar col-car">
                    <i class="fa-solid fa-car"></i>
                </div>
                <div class="node-label">গাড়ি</div>
            </div>


            <div
                class="grid-node"
                onclick="selectCategory('ডেকোরেশন')"
            >
                <div class="round-avatar col-decor">
                    <i class="fa-solid fa-couch"></i>
                </div>
                <div class="node-label">ডেকোরেশন</div>
            </div>


            <div
                class="grid-node"
                onclick="selectCategory('ইলেকট্রনিক্স')"
            >
                <div class="round-avatar col-sound">
                    <i class="fa-solid fa-headphones"></i>
                </div>
                <div class="node-label">ইলেকট্রনিক্স</div>
            </div>


            <div
                class="grid-node"
                onclick="selectCategory('ইলেকট্রিক')"
            >
                <div class="round-avatar col-elec">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="node-label">ইলেকট্রিক</div>
            </div>


            <div
                class="grid-node"
                onclick="selectCategory('আরও')"
            >
                <div class="round-avatar col-more">
                    <i class="fa-solid fa-ellipsis"></i>
                </div>
                <div class="node-label">আরও</div>
            </div>

        </div>


        <!-- ================= PROMO ================= -->

        <div class="promo-marketing-card">

            <div class="promo-meta">

                <h4>
                    আজকের বিশেষ অফার 🎉
                </h4>

                <p>
                    নির্বাচিত পণ্যে বিশেষ ছাড়
                </p>

            </div>

            <button
                class="action-sub-btn"
                onclick="showMessage('অফারগুলো শীঘ্রই দেখানো হবে!')"
            >
                দেখুন
                <i class="fa-solid fa-arrow-right"></i>
            </button>

        </div>


        <!-- ================= PRODUCTS ================= -->

        <div class="deals-header">

            <h3>
                জনপ্রিয় পণ্য
            </h3>

            <a href="#" onclick="showAll(event)">
                সব দেখুন
                <i class="fa-solid fa-angle-right"></i>
            </a>

        </div>


        <div class="products">

            <!-- Product 1 -->

            <div class="product-card">

                <img
                    class="product-image"
                    src="https://images.unsplash.com/photo-1565299507177-b0ac66763828?auto=format&fit=crop&w=500&q=80"
                    alt="Burger"
                >

                <div class="product-info">

                    <div class="product-name">
                        Chicken Burger
                    </div>

                    <div>
                        <span class="product-price">
                            ৳১৮০
                        </span>

                        <span class="product-old-price">
                            ৳২২০
                        </span>
                    </div>

                    <button
                        class="add-cart"
                        onclick="addCart('Chicken Burger')"
                    >
                        <i class="fa-solid fa-cart-plus"></i>
                        কার্টে যোগ করুন
                    </button>

                </div>

            </div>


            <!-- Product 2 -->

            <div class="product-card">

                <img
                    class="product-image"
                    src="https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=500&q=80"
                    alt="T Shirt"
                >

                <div class="product-info">

                    <div class="product-name">
                        Premium T-Shirt
                    </div>

                    <div>
                        <span class="product-price">
                            ৳৪৫০
                        </span>

                        <span class="product-old-price">
                            ৳৫৫০
                        </span>
                    </div>

                    <button
                        class="add-cart"
                        onclick="addCart('Premium T-Shirt')"
                    >
                        <i class="fa-solid fa-cart-plus"></i>
                        কার্টে যোগ করুন
                    </button>

                </div>

            </div>

        </div>

    </main>


    <!-- ================= BOTTOM NAV ================= -->

    <nav class="fixed-footer-nav">

        <a
            href="#"
            class="footer-action-node active"
            onclick="navClick(event,'হোম')"
        >
            <i class="fa-solid fa-house"></i>
            <span>হোম</span>
        </a>


        <a
            href="#"
            class="footer-action-node"
            onclick="navClick(event,'ক্যাটাগরি')"
        >
            <i class="fa-solid fa-grid-2"></i>
            <span>ক্যাটাগরি</span>
        </a>


        <a
            href="#"
            class="footer-action-node"
            onclick="navClick(event,'কার্ট')"
        >
            <div class="cart-wrapper-rel">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge" id="cartCount">0</span>
            </div>
            <span>কার্ট</span>
        </a>


        <a
            href="#"
            class="footer-action-node"
            onclick="navClick(event,'অর্ডার')"
        >
            <i class="fa-solid fa-box"></i>
            <span>অর্ডার</span>
        </a>


        <a
            href="#"
            class="footer-action-node"
            onclick="navClick(event,'প্রোফাইল')"
        >
            <i class="fa-regular fa-user"></i>
            <span>প্রোফাইল</span>
        </a>

    </nav>

</div>


<!-- ================= JAVASCRIPT ================= -->

<script>

    let cartCount = 0;


    /* Search */

    document
        .getElementById("searchInput")
        .addEventListener("keyup", function () {

            const value = this.value.trim();

            if (value.length > 0) {

                console.log("Searching:", value);

            }

        });


    /* Category */

    function selectCategory(category) {

        showMessage(category + " ক্যাটাগরি নির্বাচিত হয়েছে");

    }


    /* Cart */

    function addCart(product) {

        cartCount++;

        document
            .getElementById("cartCount")
            .innerText = cartCount;

        showMessage(product + " কার্টে যোগ হয়েছে 🛒");

    }


    /* QR */

    function openQR() {

        showMessage("QR Scanner শীঘ্রই চালু হবে 📷");

    }


    /* Navigation */

    function navClick(event, name) {

        event.preventDefault();

        showMessage(name + " পেজ শীঘ্রই আসছে");

    }


    /* All Products */

    function showAll(event) {

        event.preventDefault();

        showMessage("সব পণ্য শীঘ্রই দেখানো হবে");

    }


    /* Message */

    function showMessage(message) {

        alert(message);

    }

</script>

</body>
</html>
