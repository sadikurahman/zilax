<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zilax - Shop • Rent • Live Better</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f8; color: #333; padding-bottom: 70px; display: flex; justify-content: center; }
        
        /* Mobile Screen Container Mockup */
        .phone-container { width: 100%; max-width: 430px; background: #fff; min-height: 100vh; position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.1); overflow-x: hidden; }
        
        /* Header */
        header { background-color: #0b6623; padding: 20px 16px 15px; color: white; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .logo span { color: #fff; }
        .header-icons { display: flex; gap: 15px; font-size: 20px; position: relative; }
        .badge { position: absolute; top: -5px; right: -5px; background: red; color: white; font-size: 10px; padding: 2px 5px; border-radius: 50%; }
        
        /* Search Bar */
        .search-container { position: relative; width: 100%; }
        .search-container input { width: 100%; padding: 12px 40px 12px 40px; border: none; border-radius: 25px; background: #fff; font-size: 14px; color: #666; }
        .search-container .fa-search { position: absolute; left: 15px; top: 14px; color: #999; }
        .search-container .fa-sliders { position: absolute; right: 15px; top: 14px; color: #999; }

        /* Main Content */
        .content { padding: 16px; }

        /* Banner Slider */
        .banner { background: linear-gradient(to right, #111, #333); color: white; padding: 20px; border-radius: 15px; position: relative; overflow: hidden; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .banner-text h2 { font-size: 20px; color: #fff; margin-bottom: 5px; }
        .banner-text p { font-size: 12px; color: #ccc; margin-bottom: 12px; }
        .banner-btn { background: #0b6623; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: bold; cursor: pointer; }
        .banner-img { width: 100px; height: 100px; background: url('https://unsplash.com') center/cover; border-radius: 10px; }
        .dots { display: flex; justify-content: center; gap: 5px; margin-top: -10px; margin-bottom: 20px; }
        .dot { width: 6px; height: 6px; background: #ccc; border-radius: 50%; }
        .dot.active { width: 18px; height: 6px; background: #0b6623; border-radius: 5px; }

        /* Grid Categories */
        .categories-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 25px; }
        .category-item { display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: #333; }
        .icon-box { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .cat-text { font-size: 12px; font-weight: 500; }
        
        /* Specific Icon Colors to match image */
        .bg-food { background-color: #ffe6e6; color: #ff4d4d; }
        .bg-cloth { background-color: #e6f2ff; color: #3399ff; }
        .bg-shoe { background-color: #e6ffe6; color: #00cc66; }
        .bg-car { background-color: #fff0e6; color: #ff9933; }
        .bg-decor { background-color: #f9f0ff; color: #b366ff; }
        .bg-sound { background-color: #edf7f7; color: #008080; }
        .bg-elec { background-color: #fffde6; color: #ccb300; }
        .bg-more { background-color: #f2f2f2; color: #666; }

        /* Promo Banner Middle */
        .promo-banner { background: linear-gradient(135deg, #05471b, #0b6623); color: white; padding: 15px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .promo-text h4 { font-size: 15px; margin-bottom: 4px; }
        .promo-text p { font-size: 11px; opacity: 0.8; }
        .promo-btn { background: #fff; color: #0b6623; border: none; padding: 6px 12px; border-radius: 15px; font-size: 11px; font-weight: bold; }

        /* Product Section Section Header */
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .section-header h3 { font-size: 16px; font-weight: 700; }
        .section-header a { color: #999; font-size: 12px; text-decoration: none; }

        /* Bottom Navigation Bar */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; max-width: 430px; background: #fff; display: flex; justify-content: space-between; padding: 10px 20px; border-top: 1px solid #eee; z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #999; font-size: 11px; font-weight: 500; gap: 4px; }
        .nav-item.active { color: #0b6623; }
        .nav-item i { font-size: 20px; }
    </style>
</head>
